{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change Password" %} — Gig Saarthi{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 py-8">
    <a href="{% url 'accounts:profile' %}" class="text-primary-600 hover:text-primary-700 text-sm mb-4 inline-block">← {% trans "Back to Profile" %}</a>
    <h1 class="text-2xl font-bold mb-6">🔒 {% trans "Change Password" %}</h1>

    <form method="post" class="bg-white rounded-xl shadow-md p-6">
        {% csrf_token %}

        <div class="mb-4">
            <label for="old_password" class="block text-sm font-medium text-gray-700 mb-1">{% trans "Current Password" %}</label>
            <input type="password" id="old_password" name="old_password" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 text-base">
        </div>

        <div class="mb-4">
            <label for="new_password1" class="block text-sm font-medium text-gray-700 mb-1">{% trans "New Password" %}</label>
            <input type="password" id="new_password1" name="new_password1" required minlength="8"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 text-base"
                placeholder="{% trans 'At least 8 characters' %}">
        </div>

        <div class="mb-6">
            <label for="new_password2" class="block text-sm font-medium text-gray-700 mb-1">{% trans "Confirm New Password" %}</label>
            <input type="password" id="new_password2" name="new_password2" required
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 text-base">
        </div>

        <button type="submit"
            class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-4 rounded-lg transition text-base">
            {% trans "Change Password" %}
        </button>
    </form>
</div>
{% endblock %}
