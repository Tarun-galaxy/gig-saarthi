{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Reset Password" %} — Gig Saarthi{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">🔑 {% trans "Reset Password" %}</h1>
            <p class="mt-2 text-gray-600">{% trans "Enter your email and we'll send you a reset link." %}</p>
        </div>

        <form method="post" class="bg-white rounded-xl shadow-md p-8">
            {% csrf_token %}

            <div class="mb-6">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">{% trans "Email Address" %}</label>
                <input type="email" id="email" name="email" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 text-base"
                    placeholder="name@example.com">
            </div>

            <button type="submit"
                class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-4 rounded-lg transition text-base">
                {% trans "Send Reset Link" %}
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            <a href="{% url 'accounts:login' %}" class="text-primary-600 hover:text-primary-700 font-medium">
                ← {% trans "Back to Login" %}
            </a>
        </p>
    </div>
</div>
{% endblock %}
