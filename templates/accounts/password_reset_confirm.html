{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Set New Password" %} — Gig Saarthi{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">🔑 {% trans "Set New Password" %}</h1>
        </div>

        <form method="post" class="bg-white rounded-xl shadow-md p-8">
            {% csrf_token %}

            <div class="mb-4">
                <label for="new_password1" class="block text-sm font-medium text-gray-700 mb-1">{% trans "New Password" %}</label>
                <input type="password" id="new_password1" name="new_password1" required minlength="8"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 text-base">
            </div>

            <div class="mb-6">
                <label for="new_password2" class="block text-sm font-medium text-gray-700 mb-1">{% trans "Confirm New Password" %}</label>
                <input type="password" id="new_password2" name="new_password2" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 text-base">
            </div>

            <button type="submit"
                class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-4 rounded-lg transition text-base">
                {% trans "Reset Password" %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
