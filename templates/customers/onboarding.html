{% extends "base.html" %}
{% load i18n static %}

{% block title %}{% trans "Set Up Your Profile" %} — Gig Saarthi{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-2xl font-bold mb-6">🏠 {% trans "Set Up Your Address" %}</h1>

    <form method="post" class="bg-white rounded-xl shadow-md p-6">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Your Default Address" %}</label>
            <div class="relative">
                <input type="text" id="address-search" autocomplete="off"
                    class="w-full px-4 py-3 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 text-base"
                    placeholder="{% trans 'Search your address...' %}">
                <div id="address-suggestions" class="absolute z-10 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-1 hidden max-h-48 overflow-y-auto"></div>
            </div>
            <input type="hidden" name="default_address" id="default_address" value="{{ profile.default_address }}">
            <button type="button" id="btn-current-location"
                class="mt-2.5 group relative inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-primary-50 to-indigo-50 hover:from-primary-100 hover:to-indigo-100 dark:from-primary-950/80 dark:to-indigo-950/80 border border-primary-200/90 dark:border-primary-800/80 text-primary-700 dark:text-primary-300 text-xs font-extrabold shadow-2xs hover:shadow-xs transition-all duration-200 active:scale-95 cursor-pointer">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <i data-lucide="crosshair" class="w-3.5 h-3.5 text-primary-600 dark:text-primary-400 group-hover:rotate-45 transition-transform duration-300"></i>
                <span>{% trans "Use current GPS" %}</span>
            </button>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">{% trans "Pick Location on Map" %}</label>
            <div id="map" class="h-48 rounded-lg border border-gray-300"></div>
            <input type="hidden" name="latitude" id="latitude" value="{{ profile.default_latitude|default:'28.6139' }}">
            <input type="hidden" name="longitude" id="longitude" value="{{ profile.default_longitude|default:'77.2090' }}">
        </div>

        <button type="submit"
            class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-4 rounded-lg transition">
            {% trans "Save Address" %}
        </button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    var lat = {{ profile.default_latitude|default:"28.6139" }};
    var lon = {{ profile.default_longitude|default:"77.2090" }};

    GigMap.init('map', { center: [lat, lon], zoom: 13 });
    var pin = GigMap.addMarker('my-location', lat, lon, {
        emoji: '📍', color: GigMap.ICONS.customer, draggable: true
    });
    GigMap.makeDraggablePin('my-location', {
        latInputId: 'latitude',
        lonInputId: 'longitude',
        addressInputId: 'default_address',
    });

    GigMap.setSearchBox('address-search', 'address-suggestions', {
        latInputId: 'latitude',
        lonInputId: 'longitude',
        addressInputId: 'default_address',
    });

    document.getElementById('btn-current-location').addEventListener('click', function() {
        GigMap.useCurrentLocation({
            buttonId: 'btn-current-location',
            searchInputId: 'address-search',
            addressInputId: 'default_address',
            latInputId: 'latitude',
            lonInputId: 'longitude',
        });
    });

    if (typeof lucide !== 'undefined') lucide.createIcons();
});
</script>
{% endblock %}
